name: Build WeFlow Electron

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点按钮触发构建（推荐）

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 打包 Electron Windows
        run: npm run build

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: WeFlow-win-exe
          path: release/
